* { box-sizing: border-box; }

<script>
"use strict";
const { useState, useMemo, useRef, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_MINUTES = 24 * 60;

// ---------- Parsing the skill's consolidated JSON ----------

// "September 4, 2026" -> local Date at midnight
function parseDate(s) {
  const m = /^([A-Za-z]+) (\d{1,2}), (\d{4})$/.exec(String(s).trim());
  if (!m) return null;
  const mi = MONTHS.indexOf(m[1]);
  if (mi < 0) return null;
  return new Date(Number(m[3]), mi, Number(m[2]));
}

// "10:34 AM" -> minutes since midnight
function parseClock(s) {
  const m = /^(\d{1,2}):(\d{2}) ?([AP]M)$/i.exec(String(s).trim());
  if (!m) return null;
  let h = Number(m[1]) % 12;
  if (m[3].toUpperCase() === "PM") h += 12;
  return h * 60 + Number(m[2]);
}

// The skill emits (see _build_favorable_entry in panchangam_utils.py):
//   "Entire day" | "until T" | "from T onwards" | "from T to T",
//   several windows joined by "; ", and an optional
//   " (favorable until <Month D, YYYY> <T>)" suffix when a window runs past midnight.
function parsePrediction(text) {
  const windows = String(text).split("; ").map((raw) => {
    let s = raw.trim(), continuation = null, m;
    if ((m = /^(.*) \(favorable until (.+)\)$/.exec(s))) { s = m[1]; continuation = m[2]; }
    if (/^entire day$/i.test(s)) return { kind: "entire", start: 0, end: DAY_MINUTES, label: "Entire day", continuation };
    if ((m = /^until (.+)$/i.exec(s))) {
      return { kind: "until", start: 0, end: parseClock(m[1]), label: `Until ${m[1]}`, continuation };
    }
    if ((m = /^from (.+) onwards$/i.exec(s))) {
      return { kind: "from", start: parseClock(m[1]), end: DAY_MINUTES, label: `From ${m[1]}`, continuation };
    }
    if ((m = /^from (.+) to (.+)$/i.exec(s))) {
      return { kind: "range", start: parseClock(m[1]), end: parseClock(m[2]), label: `${m[1]} – ${m[2]}`, continuation };
    }
    return { kind: "other", start: null, end: null, label: s, continuation };
  });
  const full = windows.some((w) => w.kind === "entire");
  const minutes = windows.reduce((a, w) => a + (w.start != null && w.end != null ? Math.max(0, w.end - w.start) : 0), 0);
  return { windows, full, minutes };
}

function formatContinuation(c) {
  // "October 18, 2026 12:19 AM" -> "Oct 18, 12:19 AM"
  const m = /^([A-Za-z]+) (\d{1,2}), \d{4} (.+)$/.exec(c);
  return m ? `${m[1].slice(0, 3)} ${m[2]}, ${m[3]}` : c;
}

function validate(data) {
  if (!data || typeof data !== "object") return "not a JSON object";
  if (!Array.isArray(data.months)) return "missing a \"months\" list";
  for (const mo of data.months) {
    if (!mo || !Array.isArray(mo.favorable_days)) return "a month is missing \"favorable_days\"";
    for (const d of mo.favorable_days) {
      if (!d || typeof d.date !== "string" || typeof d.prediction !== "string") return "a day row is missing \"date\"/\"prediction\"";
    }
  }
  return null;
}

function normalize(data, source) {
  const months = data.months.map((mo) => {
    const days = mo.favorable_days
      .map((row) => {
        const date = parseDate(row.date);
        return date ? { raw: row, date, weekday: WEEKDAYS[date.getDay()], ...parsePrediction(row.prediction) } : null;
      })
      .filter(Boolean)
      .sort((a, b) => a.date - b.date);
    const monthIndex = MONTHS.indexOf(mo.month);
    return { month: mo.month, year: mo.year, monthIndex, key: `${mo.year}-${String(monthIndex + 1).padStart(2, "0")}`, days };
  });
  const weekdays = [...new Set(months.flatMap((m) => m.days.map((d) => d.date.getDay())))].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
  return {
    id: `${source}::${data.person}::${data.input_city_name}::${data.starting_month_year}::${data.forward_looking_months}`,
    source,
    person: data.person || "Unknown",
    nakshatram: data.input_nakshatram || "—",
    city: data.input_city_name || "—",
    start: data.starting_month_year || (months[0] ? `${months[0].month} ${months[0].year}` : "—"),
    span: data.forward_looking_months ?? months.length,
    months,
    weekdays,
  };
}

async function readJsonFiles(fileList) {
  const loaded = [], errors = [];
  const files = [...fileList].filter((f) => /\.json$/i.test(f.name));
  if (!files.length) errors.push("No .json files found in that selection.");
  for (const f of files) {
    const label = f.webkitRelativePath || f.name;
    try {
      const data = JSON.parse(await f.text());
      const problem = validate(data);
      if (problem) { if (files.length === 1) errors.push(`${label}: ${problem}.`); continue; }
      loaded.push(normalize(data, label));
    } catch (e) {
      errors.push(`${label}: could not be read as JSON.`);
    }
  }
  if (files.length > 1 && !loaded.length && !errors.length) errors.push("None of those .json files look like prediction results.");
  return { loaded, errors };
}

  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("pv-theme") || "auto"; } catch { return "auto"; } });

  }, [theme]);
  return [theme, setTheme];
}

  folder: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
  upload: html`<svg class="big-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>`,
  print: html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>`,
};

// ---------- Components ----------

function Pickers({ onFiles, primary }) {
  const fileRef = useRef(null), dirRef = useRef(null);
  useEffect(() => { if (dirRef.current) dirRef.current.setAttribute("webkitdirectory", ""); }, []);
  const pick = (ref) => () => ref.current && ref.current.click();
  const change = (e) => { onFiles(e.target.files); e.target.value = ""; };
  return html`
    <input ref=${fileRef} type="file" accept=".json,application/json" multiple class="sr" onChange=${change} tabIndex="-1" aria-hidden="true" />
    <input ref=${dirRef} type="file" multiple class="sr" onChange=${change} tabIndex="-1" aria-hidden="true" />
    <button class=${"btn" + (primary ? " primary" : "")} onClick=${pick(fileRef)}>${Icon.file} Open JSON file${primary ? "(s)" : ""}</button>
    <button class="btn" onClick=${pick(dirRef)}>${Icon.folder} Open output folder</button>
  `;
}

function Empty({ onFiles, onSample, errors }) {
  const [over, setOver] = useState(false);
  return html`
    <div
      class=${"drop" + (over ? " over" : "")}
      onDragOver=${(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave=${() => setOver(false)}
      onDrop=${(e) => { e.preventDefault(); setOver(false); onFiles(e.dataTransfer.files); }}
    >
      ${Icon.upload}
      <h2>View your favorable days and times</h2>
      <p>Drop a prediction <code>.json</code> here, or open your whole output folder to load every person and city in it at once.</p>
      <div class="actions">
        <${Pickers} onFiles=${onFiles} primary=${true} />
        <button class="btn ghost" onClick=${onSample}>Try a sample</button>
      </div>
      <p class="hint">
        The skill writes results to <code>{person}_output_dir/{person}/{city}/{person}_{Month}_{Year}_{N}.json</code>
        in the folder Claude was working in.<br/>Files are read in your browser only. Nothing is uploaded.
      </p>
    </div>
    ${errors.length > 0 && html`<${Errors} errors=${errors} />`}
  `;
}

function Errors({ errors }) {
  return html`<div class="alert" role="alert"><b>Some files couldn't be loaded</b><ul>${errors.map((e) => html`<li key=${e}>${e}</li>`)}</ul></div>`;
}

function DayBar({ day }) {
  const segs = day.windows.filter((w) => w.start != null && w.end != null && w.end > w.start);
  return html`
    <div>
      <div class="bar" role="img" aria-label=${`Favorable: ${day.windows.map((w) => w.label).join(", ")}`}>
        ${segs.map((w, i) => html`<i key=${i} class=${day.full ? "full" : "partial"} style=${{ left: `${(w.start / DAY_MINUTES) * 100}%`, width: `${((w.end - w.start) / DAY_MINUTES) * 100}%` }}></i>`)}
      </div>
      <div class="bar-axis" aria-hidden="true"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
    </div>
  `;
}

function DayRow({ day, today }) {
  const isToday = sameDay(day.date, today);
  const past = day.date < today;
  const conts = day.windows.filter((w) => w.continuation);
  return html`
    <div class=${"day" + (past ? " past" : "") + (isToday ? " today" : "")}>
      <div class="d">${fmtShort(day.date)}<small>${day.weekday}</small></div>
      <div class="win">
        <span class="t">
          ${day.windows.map((w) => w.label).join(" · ")}
          <span class=${"badge " + (day.full ? "full" : "partial")}>${day.full ? "Full day" : "Partial"}</span>
          ${isToday && html`<span class="badge now">Today</span>`}
        </span>
        ${conts.map((w, i) => html`<span key=${i} class="cont">Continues until ${formatContinuation(w.continuation)}</span>`)}
      </div>
      <div class="barcol"><${DayBar} day=${day} /></div>
    </div>
  `;
}

function MonthList({ month, today }) {
  return html`
    <div class="card days">
      ${month.days.length
        ? month.days.map((d) => html`<${DayRow} key=${d.raw.date} day=${d} today=${today} />`)
        : html`<div class="nil">No favorable days match.</div>`}
    </div>
  `;
}

function MonthCalendar({ month, today }) {
  const byDate = new Map(month.days.map((d) => [d.date.getDate(), d]));
  const first = new Date(month.year, month.monthIndex, 1);
  const count = new Date(month.year, month.monthIndex + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7; // Monday-first grid
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(html`<div key=${"b" + i} class="cell blank"></div>`);
  for (let n = 1; n <= count; n++) {
    const date = new Date(month.year, month.monthIndex, n);
    const d = byDate.get(n);
    const cls = ["cell", d ? "fav " + (d.full ? "full" : "partial") : "", date < today ? "past" : "", sameDay(date, today) ? "today" : ""].join(" ");
    cells.push(html`
      <div key=${n} class=${cls} title=${d ? `${fmtLong(date)}: ${d.raw.prediction}` : undefined}>
        <span class="n">${n}</span>
        ${d && html`<span class="w">${d.full ? "Full day" : d.windows.map((w) => w.label).join(", ")}</span>`}
      </div>`);
  }
  return html`
    <div class="card cal">
      <div class="grid">
        ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((w) => html`<div key=${w} class="wd">${w}</div>`)}
        ${cells}
      </div>
    </div>
  `;
}

function Viewer({ ds, today }) {
  const [view, setView] = useState("list");
  const [weekdayFilter, setWeekdayFilter] = useState(() => new Set());
  const [fullOnly, setFullOnly] = useState(false);
  const [hidePast, setHidePast] = useState(false);

  useEffect(() => { setWeekdayFilter(new Set()); }, [ds.id]);

  const allDays = useMemo(() => ds.months.flatMap((m) => m.days), [ds]);
  const upcoming = allDays.filter((d) => d.date >= today);
  const next = upcoming[0];
  const nextFull = upcoming.find((d) => d.full);

  const filtered = useMemo(() => ds.months.map((m) => ({
    ...m,
    days: m.days.filter((d) =>
      (!weekdayFilter.size || weekdayFilter.has(d.date.getDay())) &&
      (!fullOnly || d.full) &&
      (!hidePast || d.date >= today)),
  })), [ds, weekdayFilter, fullOnly, hidePast, today]);

  const toggleWeekday = (w) => setWeekdayFilter((s) => { const n = new Set(s); n.has(w) ? n.delete(w) : n.add(w); return n; });
  const hasPast = allDays.some((d) => d.date < today);

  return html`
    <div class="card summary">
      <div>
        <h2>${ds.person}</h2>
        <div class="sub">${ds.nakshatram} nakshatram · ${ds.city} · ${ds.span} month${ds.span == 1 ? "" : "s"} from ${ds.start}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="v">${allDays.length}</div><div class="l">Favorable days</div></div>
        <div class="stat"><div class="v">${allDays.filter((d) => d.full).length}</div><div class="l">Full days</div></div>
        <div class="stat"><div class="v">${upcoming.length}</div><div class="l">Still ahead</div></div>
        <div class="stat"><div class="v">${ds.weekdays.map((w) => WEEKDAYS[w].slice(0, 3)).join(" ") || "—"}</div><div class="l">Weekdays</div></div>
      </div>
      ${next && html`
        <div class="next">
          <div>
            <div class="lbl">${sameDay(next.date, today) ? "Today" : "Next favorable"}</div>
            <div class="when">${fmtLong(next.date)} · ${next.windows.map((w) => w.label).join(", ")}</div>
            ${nextFull && nextFull !== next && html`<div class="sub">Next full day: ${fmtLong(nextFull.date)}</div>`}
          </div>
        </div>`}
    </div>

    <div class="toolbar">
      <div class="seg" role="group" aria-label="View">
        <button aria-pressed=${view === "list"} onClick=${() => setView("list")}>List</button>
        <button aria-pressed=${view === "calendar"} onClick=${() => setView("calendar")}>Calendar</button>
      </div>
      <div class="chips" role="group" aria-label="Filter by weekday">
        ${ds.weekdays.map((w) => html`<button key=${w} class="chip" aria-pressed=${weekdayFilter.has(w)} onClick=${() => toggleWeekday(w)}>${WEEKDAYS[w].slice(0, 3)}</button>`)}
      </div>
      <label class="toggle"><input type="checkbox" checked=${fullOnly} onChange=${(e) => setFullOnly(e.target.checked)} /> Full days only</label>
      ${hasPast && html`<label class="toggle"><input type="checkbox" checked=${hidePast} onChange=${(e) => setHidePast(e.target.checked)} /> Hide past</label>`}
    </div>

    <nav class="monthnav" aria-label="Months">
      ${filtered.map((m) => html`<a key=${m.key} href=${"#m-" + m.key} class=${m.days.length ? "" : "empty"}>${m.month.slice(0, 3)} ${m.year}<small>${m.days.length}</small></a>`)}
    </nav>

    ${filtered.map((m) => html`
      <section key=${m.key} class="month" id=${"m-" + m.key}>
        <h3>${m.month} ${m.year} <small>${m.days.length} favorable day${m.days.length === 1 ? "" : "s"}</small></h3>
        ${view === "list" ? html`<${MonthList} month=${m} today=${today} />` : html`<${MonthCalendar} month=${m} today=${today} />`}
      </section>`)}

    ${view === "calendar" && html`
      <div class="legend">
        <span><i style=${{ background: "var(--full-soft)", boxShadow: "inset 0 0 0 1px var(--full)" }}></i> Favorable all day</span>
        <span><i style=${{ background: "var(--partial-soft)", boxShadow: "inset 0 0 0 1px var(--partial)" }}></i> Favorable part of the day</span>
      </div>`}
  `;
}

function App() {
  const [datasets, setDatasets] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [errors, setErrors] = useState([]);
  const [theme, setTheme] = useTheme();
  const today = useMemo(startOfToday, []);

  const add = useCallback((loaded) => {
    if (!loaded.length) return;
    setDatasets((cur) => {
      const map = new Map(cur.map((d) => [d.id, d]));
      loaded.forEach((d) => map.set(d.id, d));
      return [...map.values()];
    });
    setActiveId(loaded[0].id);
  }, []);

  const onFiles = useCallback(async (files) => {
    const { loaded, errors } = await readJsonFiles(files);
    setErrors(errors);
    add(loaded);
  }, [add]);

  const onSample = useCallback(() => {
    const data = JSON.parse(document.getElementById("sample-data").textContent);
    setErrors([]);
    add([normalize(data, "sample")]);
  }, [add]);

  // Allow dropping more files anywhere once something is loaded.
  useEffect(() => {
    if (!datasets.length) return;
    const over = (e) => e.preventDefault();
    const drop = (e) => { e.preventDefault(); if (e.dataTransfer.files.length) onFiles(e.dataTransfer.files); };
    window.addEventListener("dragover", over);
    window.addEventListener("drop", drop);
    return () => { window.removeEventListener("dragover", over); window.removeEventListener("drop", drop); };
  }, [datasets.length, onFiles]);

  const active = datasets.find((d) => d.id === activeId) || datasets[0];
  const nextTheme = { auto: "light", light: "dark", dark: "auto" }[theme];

  return html`
    <div class="wrap">
      <header class="top">
        <h1>${Icon.sun} Panchangam Viewer</h1>
        <span class="spacer"></span>
        ${datasets.length > 0 && html`
          <${Pickers} onFiles=${onFiles} />
          <button class="btn ghost" onClick=${() => window.print()} title="Print">${Icon.print}<span class="sr">Print</span></button>`}
        <button class="btn ghost" onClick=${() => setTheme(nextTheme)} title="Switch theme">Theme: ${theme}</button>
      </header>

      ${!active
        ? html`<${Empty} onFiles=${onFiles} onSample=${onSample} errors=${errors} />`
        : html`
          ${errors.length > 0 && html`<${Errors} errors=${errors} />`}
          ${datasets.length > 1 && html`
            <div class="datasets" role="tablist" aria-label="Loaded predictions">
              ${datasets.map((d) => html`
                <button key=${d.id} role="tab" class="ds" aria-selected=${d.id === active.id} onClick=${() => setActiveId(d.id)} title=${d.source}>
                  <b>${d.person}</b><span>${d.city} · ${d.start} · ${d.span} mo</span>
                </button>`)}
            </div>`}
          <${Viewer} key=${active.id} ds=${active} today=${today} />`}

      <footer>
        Times are local to the prediction's city, as published by drikpanchang.com. This is a calculation aid, not astrological advice.
        · <a href="https://github.com/sreenaathkv/predicting-favorable-time-per-panchangam">Source on GitHub</a>
      </footer>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
